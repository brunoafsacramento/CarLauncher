name: Gerar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: unzip -q -o '*.zip'
      - run: gradle assembleDebug
        working-directory: CarLauncher
      - run: gh release create "build-${{ github.run_number }}" CarLauncher/app/build/outputs/apk/debug/app-debug.apk --title "Build ${{ github.run_number }}"
        env:
          GH_TOKEN: ${{ github.token }}
