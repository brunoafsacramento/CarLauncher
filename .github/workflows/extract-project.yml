name: Extrair código-fonte

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair ZIP
        run: |
          set -euo pipefail
          unzip -q -o CarLauncher.zip -d .
          test -d CarLauncher
          find CarLauncher -maxdepth 2 -type f | head -50

      - name: Salvar arquivos no GitHub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- CarLauncher
          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi
          git commit -m "Extract CarLauncher source code"
          git push
